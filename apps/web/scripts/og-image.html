<!doctype html>
<!-- Source of public/og-image.png, the 1200 × 630 share image. Regenerate: node scripts/og-image.mjs -->
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Latin:wdth,wght@75..125,400..800&family=Geist+Mono:wght@500&family=Poppins:wght@500;600&display=block" />
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0f172a;
    color: #fff;
    font-family: "Poppins", sans-serif;
    position: relative;
    overflow: hidden;
  }
  .glow {
    position: absolute; inset: auto -200px -380px auto; width: 900px; height: 900px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37, 99, 235, 0.55), rgba(37, 99, 235, 0) 65%);
  }
  .wrap { position: absolute; inset: 64px 72px 56px; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; font-family: "Anek Latin"; font-stretch: 90%; font-weight: 700; font-size: 36px; }
  .mark { width: 56px; height: 56px; border-radius: 14px; background: #1e3a8a; display: grid; place-items: center; color: #f59e0b; font: 900 40px Arial, sans-serif; }
  h1 {
    margin-top: 52px; font-family: "Anek Latin"; font-stretch: 80%; font-weight: 800; font-size: 84px; line-height: 0.98;
    letter-spacing: -0.5px; max-width: 1060px;
  }
  h1 em { font-style: normal; color: #f59e0b; }
  .sub { margin-top: 24px; font-size: 27px; color: #cbd5e1; font-weight: 500; }
  .ruler { margin-top: auto; position: relative; height: 64px; }
  .ruler svg { width: 100%; height: 100%; }
  .foot { margin-top: 18px; display: flex; justify-content: space-between; font-family: "Geist Mono"; font-size: 22px; color: #94a3b8; }
  .foot b { color: #fff; font-weight: 500; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="wrap">
    <div class="brand"><span class="mark">↗</span>GetMeCollege</div>
    <h1>MHT-CET CAP cutoffs for <em>every</em> Maharashtra engineering college</h1>
    <p class="sub">Your merit number or percentile · every round · every seat type</p>
    <div class="ruler"><svg id="ruler" viewBox="0 0 1056 64" preserveAspectRatio="none"></svg></div>
    <div class="foot"><span>Official State CET Cell lists, CAP 2023–26</span><b>getmecollege.com</b></div>
  </div>
<script>
  // A barcode of closing ranks like the landing page's ruler: denser at the competitive end
  const svg = document.getElementById("ruler");
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const you = 0.42;
  let out = `<rect x="0" y="8" width="1056" height="48" rx="8" fill="#1e293b"/>`;
  for (let i = 0; i < 230; i++) {
    const t = Math.pow(rand(), 0.75);
    const x = 6 + t * 1044;
    out += `<rect x="${x.toFixed(1)}" y="14" width="2" height="36" fill="${t >= you ? "#3b82f6" : "#475569"}"/>`;
  }
  const yx = 6 + you * 1044;
  out += `<rect x="${yx - 2}" y="0" width="4" height="64" rx="2" fill="#f59e0b"/>`;
  svg.innerHTML = out;
</script>
</body>
</html>
