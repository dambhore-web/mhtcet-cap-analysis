# Railway service: compass-web. Root directory = repo root (the web app imports packages/core);
# set the service's config file path to apps/web/railway.toml. VITE_API_URL is read at build
# time. See docs/09-devops/deployment.md.
[build]
buildCommand = "npm install --include=dev && npm run build -w @mhtcet/web"
watchPatterns = ["apps/web/**", "packages/core/**", "package.json", "package-lock.json"]

[deploy]
# no -s: routing comes from dist/serve.json (written at build), so prerendered pages are served
startCommand = "npx serve apps/web/dist -l $PORT"
restartPolicyType = "ON_FAILURE"
