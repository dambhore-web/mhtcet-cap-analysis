[build]
buildCommand = "npm ci --workspace=@mhtcet/api --include-workspace-root && npm run build --workspace=@mhtcet/core"
builder = "NIXPACKS"

[deploy]
startCommand = "node --import tsx/esm src/index.ts"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.healthcheck]
path = "/api/health"
timeout = 30
