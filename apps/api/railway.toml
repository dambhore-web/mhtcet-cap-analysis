# Railway service: compass-api. Root directory = repo root (the API imports packages/core);
# set the service's config file path to apps/api/railway.toml. See docs/09-devops/deployment.md.
[build]
buildCommand = "npm install --include=dev"
watchPatterns = ["apps/api/**", "packages/core/**", "package.json", "package-lock.json"]

[deploy]
startCommand = "npm run start -w @mhtcet/api"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

[deploy.healthcheck]
path = "/api/health"
timeout = 30
