# Root Railway/Railpack config — Railpack reads this file from the repo root.
# Build and start commands are delegated to per-service env vars (SERVICE_BUILD, SERVICE_CMD)
# so one file serves both compass-api and compass-web.
# Railway-level settings (healthcheck, watchPatterns, restartPolicy) live in the
# service-specific files: apps/api/railway.toml and apps/web/railway.toml.
[deploy]
startCommand = "sh -c \"$SERVICE_CMD\""
