name: Staging data load

# Loads official CET Cell datasets into the STAGING database only. Runs when
# packages/pipeline/staging-load.json changes (the file lists what to load), so the database
# password stays in the DATABASE_URL_STAGING secret and never enters a dev session.
# Production loads are separate and need the operator's explicit approval.
on:
  push:
    paths:
      - "packages/pipeline/staging-load.json"

# Read-only GITHUB_TOKEN: the job only reads the repo; the database secret is separate.
permissions:
  contents: read

concurrency:
  group: staging-load
  cancel-in-progress: false

jobs:
  load:
    name: Load to staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}

    steps:
      - name: Require the staging secret
        run: test -n "$DATABASE_URL_STAGING" || { echo "DATABASE_URL_STAGING is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Apply pending migrations
        run: npm run migrate -w @mhtcet/pipeline

      - name: Remove rows stored under old codes
        working-directory: packages/pipeline
        run: |
          years=$(jq -r '.cutoffs.cleanupYears // [] | join(" ")' staging-load.json)
          if [ -n "$years" ]; then npm run -s db:cleanup-codes -- $years; else echo "nothing to clean up"; fi

      - name: Cutoff lists (full year load, oldest first)
        working-directory: packages/pipeline
        run: |
          for year in $(jq -r '.cutoffs.years // [] | sort | .[]' staging-load.json); do
            echo "::group::cutoffs $year"
            npm run -s discover -- "$year"
            npm run -s download -- "$year"
            npm run -s parse:institutes -- "$year"
            npm run -s parse:cutoffs -- "$year"
            npm run -s validate -- "$year"
            npm run -s load -- "$year"
            echo "::endgroup::"
          done

      - name: Seat matrix
        working-directory: packages/pipeline
        run: |
          for year in $(jq -r '.seatMatrix.years // [] | sort | .[]' staging-load.json); do
            echo "::group::seat matrix $year"
            npm run -s discover -- "$year"
            npm run -s download -- "$year" --seat-matrix
            npm run -s parse:institutes -- "$year"
            npm run -s parse:cutoffs -- "$year"
            npm run -s parse:seatmatrix -- "$year"
            npm run -s load:seatmatrix -- "$year"
            echo "::endgroup::"
          done

      - name: Fees
        working-directory: packages/pipeline
        run: |
          if [ "$(jq -r '.fees // false' staging-load.json)" = "true" ]; then npm run -s load:fees; else echo "fees not requested"; fi

      - name: Placement (NIRF)
        working-directory: packages/pipeline
        run: |
          if [ "$(jq -r '.placement // false' staging-load.json)" = "true" ]; then npm run -s load:placement; else echo "placement not requested"; fi

      - name: Merit lists
        working-directory: packages/pipeline
        run: |
          jq -c '.merit // [] | .[]' staging-load.json | while read -r m; do
            year=$(jq -r .year <<<"$m"); list=$(jq -r .list <<<"$m")
            echo "::group::merit $year $list"
            npm run -s discover -- "$year"
            npm run -s download -- "$year" --merit "$list"
            npm run -s parse:merit -- "$year" "$list"
            npm run -s load:merit -- "$year" "$list"
            echo "::endgroup::"
          done

      - name: Audit staging after the load
        run: npm run data:audit -w @mhtcet/pipeline
