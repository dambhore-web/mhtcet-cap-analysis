name: Staging data load

# Loads official CET Cell datasets into the STAGING database only. Runs when
# packages/pipeline/staging-load.json changes (the file lists what to load), so the database
# password stays in the DATABASE_URL_STAGING secret and never enters a dev session.
# Production loads are separate and need the operator's explicit approval.
on:
  push:
    paths:
      - "packages/pipeline/staging-load.json"

concurrency:
  group: staging-load
  cancel-in-progress: false

jobs:
  load:
    name: Load to staging
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}

    steps:
      - name: Require the staging secret
        run: test -n "$DATABASE_URL_STAGING" || { echo "DATABASE_URL_STAGING is not set"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Merit lists
        working-directory: packages/pipeline
        run: |
          jq -c '.merit // [] | .[]' staging-load.json | while read -r m; do
            year=$(jq -r .year <<<"$m"); list=$(jq -r .list <<<"$m")
            echo "::group::merit $year $list"
            npm run -s discover -- "$year"
            npm run -s download -- "$year" --merit "$list"
            npm run -s parse:merit -- "$year" "$list"
            npm run -s load:merit -- "$year" "$list"
            echo "::endgroup::"
          done

      - name: Audit staging after the load
        run: npm run data:audit -w @mhtcet/pipeline
