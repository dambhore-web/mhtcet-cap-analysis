name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, Dev]

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Runs the real API over the demo dataset (apps/api/src/demo): no database or secrets needed.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run e2e:install -w @mhtcet/web

      - name: Run Playwright tests
        run: npm run e2e -w @mhtcet/web

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  e2e-live:
    name: Playwright live smoke (staging data)
    runs-on: ubuntu-latest
    # Checks the app against the real staging Supabase data; skipped when the secret isn't set.
    if: github.event_name == 'pull_request'
    env:
      DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}

    steps:
      - uses: actions/checkout@v4
        if: env.DATABASE_URL_STAGING != ''

      - uses: actions/setup-node@v4
        if: env.DATABASE_URL_STAGING != ''
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        if: env.DATABASE_URL_STAGING != ''
        run: npm ci

      - name: Install Playwright browsers
        if: env.DATABASE_URL_STAGING != ''
        run: npm run e2e:install -w @mhtcet/web

      - name: Run live smoke tests
        if: env.DATABASE_URL_STAGING != ''
        run: npm run e2e -w @mhtcet/web
        env:
          E2E_LIVE: "1"
