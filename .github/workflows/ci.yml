name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck & test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=high

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    # Only run when web or API source changes
    if: |
      github.event_name == 'pull_request' &&
      contains(toJson(github.event.pull_request.changed_files), 'apps/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npm run e2e:install -w @mhtcet/web

      - name: Run Playwright tests
        run: npm run e2e -w @mhtcet/web
        env:
          DATABASE_URL_STAGING: ${{ secrets.DATABASE_URL_STAGING }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
